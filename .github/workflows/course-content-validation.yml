name: Course Content Validation

# Validates that runnable code snippets bundled in the guided courses actually compile.
# This is intentionally separate from the main Android CI so language toolchains (Go today,
# more later) are only installed when course content changes.
#
# To add another language: add a sibling job (e.g. validate-rust) that sets up that toolchain,
# exports the snippets, and runs the language's compiler/linter over each exported module.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/course/**'
      - '**/LearningModels.kt'
      - 'app/src/test/java/dev/hossain/codematex/tools/**'
      - '.github/workflows/course-content-validation.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/course/**'
      - '**/LearningModels.kt'
      - 'app/src/test/java/dev/hossain/codematex/tools/**'
      - '.github/workflows/course-content-validation.yml'

jobs:
  validate-go:
    name: Validate Go course snippets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Metro 0.12.0+ requires JDK 21+ (see android.yml).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      # Runs GoSnippetExporterTest, which writes each runnable Go snippet to
      # app/build/course-snippets/go/<lessonId>/ as a self-contained module.
      - name: Export Go course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/go
        run: ./gradlew testDebugUnitTest --tests "*GoSnippetExporterTest*"

      - name: Compile and vet each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/go"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No Go snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            if ( cd "$dir" && go build ./... && go vet ./... ); then
              echo "✅ $name"
            else
              echo "::error::Go snippet '$name' failed to compile or vet."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All runnable Go course snippets compiled and passed go vet."

  validate-rust:
    name: Validate Rust course snippets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Metro 0.12.0+ requires JDK 21+ (see android.yml).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # rustup is pre-installed on ubuntu-latest; ensure clippy is available.
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustc --version && cargo clippy --version

      # Runs RustSnippetExporterTest, which writes each runnable Rust snippet to
      # app/build/course-snippets/rust/<lessonId>/ as a self-contained Cargo package.
      - name: Export Rust course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/rust
        run: ./gradlew testDebugUnitTest --tests "*RustSnippetExporterTest*"

      - name: Build and lint each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/rust"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No Rust snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            if ( cd "$dir" && cargo build --quiet && cargo clippy --quiet -- -D warnings ); then
              echo "✅ $name"
            else
              echo "::error::Rust snippet '$name' failed to build or clippy."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All runnable Rust course snippets built and passed cargo clippy."

  validate-typescript:
    name: Validate TypeScript course snippets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Metro 0.12.0+ requires JDK 21+ (see android.yml).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install TypeScript
        run: npm install --no-save typescript@5

      # Runs TypeScriptSnippetExporterTest, which writes each type-checkable snippet to
      # app/build/course-snippets/typescript/<lessonId>/snippet.ts.
      - name: Export TypeScript course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/typescript
        run: ./gradlew testDebugUnitTest --tests "*TypeScriptSnippetExporterTest*"

      - name: Type-check each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/typescript"
          tsc="${{ github.workspace }}/node_modules/.bin/tsc"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No TypeScript snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            # --moduleDetection force isolates each snippet's top-level names so identifiers like
            # `status` or `Report` do not collide with DOM globals (each file is treated as a module).
            if "$tsc" --noEmit --strict --skipLibCheck --target es2020 --lib es2020,dom --moduleDetection force "$dir/snippet.ts"; then
              echo "✅ $name"
            else
              echo "::error::TypeScript snippet '$name' failed to type-check."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All type-checkable TypeScript course snippets passed tsc --strict."

  validate-python:
    name: Validate Python course snippets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Metro 0.12.0+ requires JDK 21+ (see android.yml).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pipx install ruff

      # Runs PythonSnippetExporterTest, which writes each lintable snippet to
      # app/build/course-snippets/python/<lessonId>/snippet.py.
      - name: Export Python course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/python
        run: ./gradlew testDebugUnitTest --tests "*PythonSnippetExporterTest*"

      - name: Lint each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/python"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No Python snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            # --select E9,F limits to syntax errors and pyflakes defects (undefined names, bad
            # imports, redefinitions) — real correctness issues, without stylistic lint noise.
            if ruff check --select E9,F --no-cache "$dir/snippet.py"; then
              echo "✅ $name"
            else
              echo "::error::Python snippet '$name' failed ruff check."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All Python course snippets passed ruff check (E9,F)."

  validate-kotlin:
    name: Validate Kotlin course snippets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Metro 0.12.0+ requires JDK 21+ (see android.yml). kotlinc also needs a JDK.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # kotlinc is not pre-installed on the runner; download the official command-line compiler.
      - name: Install Kotlin compiler
        run: |
          set -euo pipefail
          KOTLIN_VERSION=2.2.0
          curl -sSL -o "$RUNNER_TEMP/kotlin.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlinc-dist"
          echo "$RUNNER_TEMP/kotlinc-dist/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Verify kotlinc
        run: kotlinc -version

      # Runs KotlinSnippetExporterTest, which writes each runnable snippet to
      # app/build/course-snippets/kotlin/<lessonId>/ as snippet.kt (raw) and wrapped.kt (in fun main).
      - name: Export Kotlin course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/kotlin
        run: ./gradlew testDebugUnitTest --tests "*KotlinSnippetExporterTest*"

      - name: Compile each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/kotlin"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No Kotlin snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            # Compile the snippet as-is (valid for top-level declarations); if that fails, fall back
            # to the fun main-wrapped variant (valid for top-level statements). A snippet passes if
            # either form compiles.
            if kotlinc "$dir/snippet.kt" -d "$dir/classes" >/dev/null 2>&1; then
              echo "✅ $name"
            elif kotlinc "$dir/wrapped.kt" -d "$dir/classes" >/dev/null 2>&1; then
              echo "✅ $name (wrapped in fun main)"
            else
              echo "::error::Kotlin snippet '$name' failed to compile. Raw compiler output:"
              kotlinc "$dir/snippet.kt" -d "$dir/classes" || true
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All runnable Kotlin course snippets compiled with kotlinc."

  validate-swift:
    name: Validate Swift course snippets
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify swift compiler
        run: swift --version

      # Runs SwiftSnippetExporterTest, which writes each runnable Swift snippet to
      # app/build/course-snippets/swift/<lessonId>/main.swift
      - name: Export Swift course snippets
        env:
          CODEMATEX_SNIPPET_OUTPUT_DIR: ${{ github.workspace }}/app/build/course-snippets/swift
        run: ./gradlew testDebugUnitTest --tests "*SwiftSnippetExporterTest*"

      - name: Compile each snippet
        run: |
          set -euo pipefail
          snippets_dir="${{ github.workspace }}/app/build/course-snippets/swift"

          if [ ! -d "$snippets_dir" ] || [ -z "$(ls -A "$snippets_dir" 2>/dev/null)" ]; then
            echo "::error::No Swift snippets were exported to $snippets_dir. Did the exporter run?"
            exit 1
          fi

          failed=0
          for dir in "$snippets_dir"/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            if swift -parse "$dir/main.swift"; then
              echo "✅ $name"
            else
              echo "::error::Swift snippet '$name' failed to compile."
              failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more course code snippets failed validation."
            exit 1
          fi
          echo "All runnable Swift course snippets compiled successfully with swift."
