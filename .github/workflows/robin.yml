name: Robin Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    timeout-minutes: 5
    uses: antongulin/robin/.github/workflows/review.yml@v2.9.0
    with:
      review-instructions-file: .github/code-reviewer.md
      request-changes: false
    secrets:
      LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
