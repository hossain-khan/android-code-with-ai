name: Robin Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    timeout-minutes: 15
    # Pin to immutable commit SHA for supply-chain security (prevents code tampering
    # since workflow has pull-requests write permission and sensitive secret access)
    uses: antongulin/robin/.github/workflows/review.yml@f97948f909c068017298de5e4b0b839ede5003dc # v2.9.0
    with:
      review-instructions-file: .github/code-reviewer.md
      request-changes: false
      # Enable Agent Mode: multi-turn reviews with repository context (reads files, callers, definitions)
      # Documentation: https://github.com/antongulin/robin/blob/main/docs/ADVANCED.md#agent-mode-multi-turn-review-with-repository-context
      agent-mode: auto
      # LLM request timeout in milliseconds (10 minutes = 600000 ms)
      # Note: Reusable workflow caller job sets 'timeout-minutes: 15' to bound overall runtime.
      # Documentation: https://github.com/antongulin/robin/blob/main/docs/ADVANCED.md#available-inputs
      llm-timeout-ms: "600000"
    secrets:
      LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
